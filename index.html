<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💼 工作時數</title>

    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png" type="image/jpeg">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f3e5f5 0%, #e1f5fe 100%);
            --accent-color: #e1bee7; 
            --warning-color: #fffde7; 
            --border-style: 2.2px solid #4a148c;
            --card-bg: rgba(255, 255, 255, 0.85);
            --primary-text: #4a148c;
        }

        body {
            font-family: -apple-system, "Helvetica Neue", sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 450px;
            padding: 25px;
            border: var(--border-style);
            box-shadow: 10px 10px 0px #4a148c;
            border-radius: 24px;
            text-align: center;
        }

        h2 { margin: 0 0 15px 0; color: var(--primary-text); font-size: 22px; }

        .input-group { margin-bottom: 12px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #6a1b9a; }

        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: var(--border-style);
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .progress-section {
            background: rgba(255, 255, 255, 0.5);
            border: var(--border-style);
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }

        .stat-box {
            background: var(--accent-color);
            border: var(--border-style);
            padding: 10px;
            border-radius: 15px;
            font-weight: bold;
        }

        .stat-box.highlight { background: var(--warning-color); }

        .btn-main {
            width: 100%;
            padding: 14px;
            background-color: #ffffff;
            border: var(--border-style);
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            color: var(--primary-text);
            cursor: pointer;
            box-shadow: 5px 5px 0px #4a148c;
            margin-bottom: 12px;
        }

        .btn-settle {
            width: 100%;
            padding: 8px;
            background-color: #f3e5f5;
            border: 1.5px dashed #4a148c;
            border-radius: 10px;
            font-size: 13px;
            color: #4a148c;
            cursor: pointer;
            margin-bottom: 20px;
        }

        /* 日曆樣式 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            background: #fff;
            padding: 10px;
            border: var(--border-style);
            border-radius: 15px;
        }

        .calendar-day-head { font-size: 10px; font-weight: bold; color: #7b1fa2; padding-bottom: 5px; }

        .calendar-cell {
            aspect-ratio: 1 / 1.2;
            border: 1px solid #eee;
            border-radius: 6px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 2px;
            font-size: 11px;
            cursor: default;
        }

        .calendar-cell.has-data {
            background-color: #f3e5f5;
            cursor: pointer;
            border-color: var(--accent-color);
        }

        .calendar-cell .date-num { color: #999; }
        .calendar-cell.has-data .date-num { color: #4a148c; font-weight: bold; }

        .work-label {
            background: #4a148c;
            color: white;
            font-size: 9px;
            padding: 1px 3px;
            border-radius: 4px;
            margin-top: 2px;
            transform: scale(0.9);
        }

        .filter-section { margin-bottom: 10px; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h2>📅 工作時數管理 📅</h2>
    
    <div class="input-group">
        <label>💪🏻 目標時數 (hr)</label>
        <input type="number" id="goalInput" value="38" onchange="renderAll()">
    </div>

    <div class="input-group">
        <label>💜 今日時數 💜</label>
        <div style="display: flex; gap: 8px;">
            <input type="number" id="dailyHour" placeholder="時" style="flex:1">
            <input type="number" id="dailyMin" placeholder="分" style="flex:1">
        </div>
    </div>

    <button class="btn-main" onclick="addRecord()">💾 儲存時數</button>

    <div class="progress-section">
        <div class="stats-container">
            <div class="stat-box highlight">
                <span style="font-size: 15px; opacity: 0.8;">目前剩餘</span><br>
                <span id="sessionGap" style="font-size: 20px;">0</span> hr
            </div>
            <div class="stat-box">
                <span style="font-size: 15px; opacity: 0.8;">目前累計</span><br>
                <span id="sessionTotal" style="font-size: 20px;">0</span> hr
            </div>
        </div>
    </div>

    <button class="btn-settle" onclick="settleAndReset()">🏁 結算 (統計歸零)</button>

    <div class="filter-section">
        <label>🔍 歷史回顧</label>
        <select id="monthFilter" onchange="renderAll()"></select>
    </div>

    <div id="calendarContainer">
        <div class="calendar-grid" id="calendarGrid">
            </div>
    </div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('workRecords')) || [];
    let lastSettleTime = parseInt(localStorage.getItem('lastSettleTime')) || 0;

    initMonthFilter();
    renderAll();

    function initMonthFilter() {
        const select = document.getElementById('monthFilter');
        const now = new Date();
        for (let i = 0; i < 6; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            const val = `${d.getFullYear()}-${d.getMonth() + 1}`;
            const text = `${d.getFullYear()}年 ${d.getMonth() + 1}月`;
            select.add(new Option(text, val));
        }
    }

    function addRecord() {
        const h = parseFloat(document.getElementById('dailyHour').value) || 0;
        const m = parseFloat(document.getElementById('dailyMin').value) || 0;
        const total = h + (m / 60);
        if (total <= 0) return;

        const now = new Date();
        records.unshift({
            id: Date.now(),
            year: now.getFullYear(),
            month: now.getMonth() + 1,
            day: now.getDate(),
            key: `${now.getFullYear()}-${now.getMonth() + 1}`,
            hours: total
        });
        localStorage.setItem('workRecords', JSON.stringify(records));
        renderAll();
        document.getElementById('dailyHour').value = "";
        document.getElementById('dailyMin').value = "";
    }

    function settleAndReset() {
        if (confirm("結算後，上方累計時數將歸零重新計算，確定嗎？")) {
            lastSettleTime = Date.now();
            localStorage.setItem('lastSettleTime', lastSettleTime);
            renderAll();
        }
    }

    function renderAll() {
        const goal = parseFloat(document.getElementById('goalInput').value) || 0;
        const [year, month] = document.getElementById('monthFilter').value.split('-').map(Number);
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = "";

        // 1. 計算統計數據 (限結算後)
        let sessionTotal = 0;
        records.forEach(r => { if (r.id > lastSettleTime) sessionTotal += r.hours; });
        document.getElementById('sessionTotal').innerText = sessionTotal.toFixed(1);
        document.getElementById('sessionGap').innerText = Math.max(0, goal - sessionTotal).toFixed(1);

        // 2. 生成日曆
        const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
        weekdays.forEach(w => {
            const d = document.createElement('div');
            d.className = 'calendar-day-head';
            d.innerText = w;
            grid.appendChild(d);
        });

        const firstDay = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();

        // 填充空白
        for (let i = 0; i < firstDay; i++) {
            grid.appendChild(document.createElement('div'));
        }

        // 生成日期
        for (let i = 1; i <= daysInMonth; i++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-cell';
            cell.innerHTML = `<span class="date-num">${i}</span>`;

            // 尋找當天的紀錄 (加總同一天)
            const dayRecords = records.filter(r => r.year === year && r.month === month && r.day === i);
            if (dayRecords.length > 0) {
                const totalDayHours = dayRecords.reduce((sum, r) => sum + r.hours, 0);
                cell.className += ' has-data';
                cell.innerHTML += `<div class="work-label">${totalDayHours.toFixed(1)}h</div>`;
                cell.onclick = () => showDayDetail(dayRecords, i);
            }
            grid.appendChild(cell);
        }
    }

    function showDayDetail(dayRecords, dayNum) {
        const action = prompt(`第 ${dayNum} 日紀錄\n目前累計：${dayRecords.reduce((sum, r) => sum + r.hours, 0).toFixed(2)} 小時\n\n輸入 'd' 刪除當天最後一筆\n輸入時數(數字) 修改最後一筆：`);
        
        if (!action) return;
        const lastRecId = dayRecords[0].id;

        if (action.toLowerCase() === 'd') {
            records = records.filter(r => r.id !== lastRecId);
        } else if (!isNaN(action)) {
            const target = records.find(r => r.id === lastRecId);
            if (target) target.hours = parseFloat(action);
        }
        
        localStorage.setItem('workRecords', JSON.stringify(records));
        renderAll();
    }
</script>

</body>
</html>
