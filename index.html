<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💼 工作時數管理</title>
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png" type="image/png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f3e5f5 0%, #e1f5fe 100%);
            --accent-color: #e1bee7; 
            --warning-color: #fffde7; 
            --border-style: 2.2px solid #4a148c;
            --card-bg: rgba(255, 255, 255, 0.9);
            --primary-text: #4a148c;
            --shadow: 8px 8px 0px #4a148c;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 500;
            background: var(--bg-gradient);
            background-attachment: fixed;
            margin: 0;
            padding-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-size: 13px;
        }
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 25px;
            border: var(--border-style);
            box-shadow: var(--shadow);
            border-radius: 24px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            margin-top: 20px;
            box-sizing: border-box;
        }
        h2 { margin: 0 0 15px 0; color: var(--primary-text); font-size: 18px; }
        .input-group { margin-bottom: 12px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #6a1b9a; }
        input, select {
            width: 100%; padding: 10px; box-sizing: border-box; border: var(--border-style);
            border-radius: 12px; font-size: 13px; outline: none; background: #fff; 
            font-family: 'Noto Sans TC', sans-serif; font-weight: 500;
        }
        .stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-box { background: var(--accent-color); border: var(--border-style); padding: 12px; border-radius: 15px; color: var(--primary-text); }
        .stat-box.highlight { background: var(--warning-color); }
        .stat-value { font-size: 18px; font-weight: 500; }
        .btn-main {
            width: 100%; padding: 14px; background-color: #ffffff; border: var(--border-style);
            border-radius: 12px; font-weight: 500; font-size: 13px; color: var(--primary-text);
            cursor: pointer; box-shadow: 5px 5px 0px #4a148c; margin-bottom: 12px;
        }
        .btn-main:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #4a148c; }
        .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-settle { background-color: #ffffff; margin-top: 5px; margin-bottom: 15px; }
        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; background: #fff;
            padding: 10px; border: var(--border-style); border-radius: 15px; margin-top: 10px;
        }
        .calendar-day-head { font-size: 11px; color: #7b1fa2; padding-bottom: 5px; }
        .calendar-cell {
            aspect-ratio: 1 / 1.3; border: 1px solid #eee; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; padding-top: 4px;
            font-size: 11px; cursor: pointer;
        }
        .calendar-cell.has-data { background-color: #f3e5f5; border: 1.5px solid #4a148c; }
        .work-label { background: #4a148c; color: white; font-size: 9px; padding: 1px 3px; border-radius: 4px; margin-top: 4px; }
        #syncStatus { font-size: 11px; margin-bottom: 10px; color: #4a148c; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📅 工作時數紀錄</h2>
        <div id="syncStatus">☁️ 雲端狀態：準備中...</div>

        <div class="input-group">
            <label>💪🏻 目標時數 (hr)</label>
            <input type="number" id="goalInput" oninput="saveLocal(); renderAll();">
        </div>

        <div class="input-group">
            <label>💜 今日時數 💜</label>
            <div style="display: flex; gap: 8px;">
                <input type="number" id="dailyHour" placeholder="時" style="flex:1">
                <input type="number" id="dailyMin" placeholder="分" style="flex:1">
            </div>
        </div>

        <button id="saveBtn" class="btn-main" onclick="addRecord()">💾 儲存並同步 SAVE</button>
        
        <div class="stats-container">
            <div class="stat-box highlight">
                <div style="font-size:12px">目前剩餘</div>
                <div id="sessionGap" class="stat-value">0.00</div>
            </div>
            <div class="stat-box">
                <div style="font-size:12px">目前累計</div>
                <div id="sessionTotal" class="stat-value">0.00</div>
            </div>
        </div>

        <button id="settleBtn" class="btn-main btn-settle" onclick="settleAll()">🎯 結算 SETTLE</button>

        <div class="input-group">
            <label>🔍 歷史回顧</label>
            <div style="display: flex; gap: 8px;">
                <select id="yearSelect" onchange="renderAll()"></select>
                <select id="monthSelect" onchange="renderAll()"></select>
            </div>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

<script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbzjxiUvE9-odBpPOkHrhl-tdRjYx_a_czEOacyNVk9j96LfuNkXg8CHnmhMze6oDVo/exec";
    let records = JSON.parse(localStorage.getItem('workRecords')) || [];
    let lastSettleTime = parseInt(localStorage.getItem('lastSettleTime')) || 0;

    async function init() {
        const now = new Date();
        const ySelect = document.getElementById('yearSelect');
        const mSelect = document.getElementById('monthSelect');
        
        for (let i = now.getFullYear() - 1; i <= now.getFullYear() + 1; i++) {
            ySelect.add(new Option(i + " 年", i));
        }
        ySelect.value = now.getFullYear();

        for (let i = 1; i <= 12; i++) {
            mSelect.add(new Option(i + " 月", i));
        }
        mSelect.value = now.getMonth() + 1;

        // 強制初始目標時數為 60 
        document.getElementById('goalInput').value = "60";
        localStorage.setItem('workGoal', "60");

        updateStatus("☁️ 正在同步雲端資料...");
        await loadFromCloud();
        renderAll();
    }

    function updateStatus(msg) {
        document.getElementById('syncStatus').innerText = msg;
    }

    async function loadFromCloud() {
        try {
            const response = await fetch(scriptURL + "?action=loadAll");
            const cloudData = await response.json();
            if (Array.isArray(cloudData)) {
                // 從雲端載入時，Apps Script 的資料結構如果含有重複資料，會在這裡自動過濾不重複的 id
                const uniqueMap = new Map();
                cloudData.forEach(item => { if(item && item.id) uniqueMap.set(item.id, item); });
                records = Array.from(uniqueMap.values());
                records.sort((a, b) => b.id - a.id); // 降序排列

                saveLocal();
                updateStatus("✅ 雲端資料已同步");
            }
        } catch (e) {
            updateStatus("⚠️ 載入失敗，目前使用離線資料");
        }
    }

    // 【核心修正】上傳雲端時，改為只傳送「最新增加的那一筆筆資料」，而不傳送整張歷史包裹！
    async function saveSingleToCloud(singleRecord) {
        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        updateStatus("⏳ 正在上傳雲端...");
        try {
            // 注意：這裡只包裝 singleRecord 傳送，避免後端重複塞入整份清單
            await fetch(scriptURL, {
                method: "POST",
                mode: 'no-cors',
                body: JSON.stringify({ action: "saveAll", data: [singleRecord] })
            });
            updateStatus("✅ 資料已成功備份至雲端");
        } catch (e) {
            updateStatus("❌ 雲端上傳失敗，已存至本地");
        }
        btn.disabled = false;
    }

    async function addRecord() {
        const h = parseFloat(document.getElementById('dailyHour').value) || 0;
        const min = parseFloat(document.getElementById('dailyMin').value) || 0;
        const total = h + (min / 60);
        if (total <= 0) return;

        const now = new Date();
        const newRecord = { id: Date.now(), year: now.getFullYear(), month: now.getMonth() + 1, day: now.getDate(), hours: total };
        
        records.unshift(newRecord);
        saveLocal();
        renderAll();
        
        document.getElementById('dailyHour').value = "";
        document.getElementById('dailyMin').value = "";
        
        // 【核心修正】只同步上傳這一筆，後端就不會出現全體日期複製貼上的慘劇
        await saveSingleToCloud(newRecord);
    }

    // 【核心修正】結算只改變手機網頁內的累計時間，絕對不上傳資料給雲端！
    function settleAll() {
        if (confirm("確定要結算嗎？結算後將歸零並重新計算。歷史紀錄仍會保留在日曆中。")) {
            lastSettleTime = Date.now();
            localStorage.setItem('lastSettleTime', lastSettleTime);
            renderAll();
            updateStatus("✅ 結算成功！新週期開始");
            // 這裡不呼叫任何上傳函式，避免觸發後端的寫入
        }
    }

    function renderAll() {
        const goal = parseFloat(document.getElementById('goalInput').value) || 0;
        const year = parseInt(document.getElementById('yearSelect').value);
        const month = parseInt(document.getElementById('monthSelect').value);
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = "";

        let currentTotal = 0;
        records.forEach(r => { if (r.id > lastSettleTime) currentTotal += r.hours; });
        document.getElementById('sessionTotal').innerText = currentTotal.toFixed(2);
        document.getElementById('sessionGap').innerText = Math.max(0, goal - currentTotal).toFixed(2);

        ['日', '一', '二', '三', '四', '五', '六'].forEach(w => {
            const h = document.createElement('div'); h.className = 'calendar-day-head'; h.innerText = w; grid.appendChild(h);
        });

        const firstDay = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));

        for (let i = 1; i <= daysInMonth; i++) {
            const cell = document.createElement('div'); cell.className = 'calendar-cell';
            const dayRecords = records.filter(r => r.year === year && r.month === month && r.day === i);
            
            if (dayRecords.length > 0) {
                cell.classList.add('has-data');
                const sum = dayRecords.reduce((s, r) => s + r.hours, 0);
                cell.innerHTML = `<span>${i}</span><div class="work-label">${sum.toFixed(2)}h</div>`;
            } else { 
                cell.innerHTML = `<span>${i}</span>`; 
            }
            cell.onclick = () => handleDateEdit(year, month, i, dayRecords);
            grid.appendChild(cell);
        }
    }

    async function handleDateEdit(y, m, d, dayRecords) {
        const currentVal = dayRecords.reduce((s, r) => s + r.hours, 0).toFixed(2);
        const newVal = prompt(`修改 [ ${m}/${d} ] 時數：\n(輸入 0 刪除)`, currentVal);
        if (newVal !== null && !isNaN(newVal)) {
            records = records.filter(r => !(r.year === y && r.month === m && r.day === d));
            let editedRecord = null;
            if (parseFloat(newVal) > 0) {
                editedRecord = { id: Date.now(), year: y, month: m, day: d, hours: parseFloat(newVal) };
                records.unshift(editedRecord);
            }
            saveLocal(); 
            renderAll(); 
            
            // 修改時也只處理單筆
            if(editedRecord) {
                await saveSingleToCloud(editedRecord);
            } else {
                // 如果是刪除，因為沒動後端刪除邏輯，先在手機端做掉
                updateStatus("✅ 本地已刪除，請手動清理試算表對應行數（若有需要）");
            }
        }
    }

    function saveLocal() {
        localStorage.setItem('workRecords', JSON.stringify(records));
        localStorage.setItem('workGoal', document.getElementById('goalInput').value);
    }

    window.onload = init;
</script>
</body>
</html>
