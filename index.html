<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💼 工作時數</title>

     <link rel="apple-touch-icon" href="icon.png">

<link rel="icon" href="icon.png" type="image/png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f3e5f5 0%, #e1f5fe 100%);
            --accent-color: #e1bee7; 
            --warning-color: #fffde7; 
            --border-style: 2.2px solid #4a148c;
            --card-bg: rgba(255, 255, 255, 0.85);
            --primary-text: #4a148c;
        }

        body {
            font-family: -apple-system, "Helvetica Neue", sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 450px;
            padding: 25px;
            border: var(--border-style);
            box-shadow: 10px 10px 0px #4a148c;
            border-radius: 24px;
            text-align: center;
        }

        h2 { margin: 0 0 15px 0; color: var(--primary-text); font-size: 22px; }

        .input-group { margin-bottom: 12px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #6a1b9a; }

        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: var(--border-style);
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .progress-section {
            background: rgba(255, 255, 255, 0.5);
            border: var(--border-style);
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }

        .stat-box {
            background: var(--accent-color);
            border: var(--border-style);
            padding: 10px;
            border-radius: 15px;
            font-weight: bold;
        }

        .stat-box.highlight { background: var(--warning-color); }

        .btn-main {
            width: 100%;
            padding: 14px;
            background-color: #ffffff;
            border: var(--border-style);
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            color: var(--primary-text);
            cursor: pointer;
            box-shadow: 5px 5px 0px #4a148c;
            margin-bottom: 12px;
        }

        .btn-settle {
            width: 100%;
            padding: 8px;
            background-color: #f3e5f5;
            border: 1.5px dashed #4a148c;
            border-radius: 10px;
            font-size: 13px;
            color: #4a148c;
            cursor: pointer;
            margin-bottom: 20px;
        }

        /* 日曆樣式 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            background: #fff;
            padding: 10px;
            border: var(--border-style);
            border-radius: 15px;
        }

        .calendar-day-head { font-size: 10px; font-weight: bold; color: #7b1fa2; padding-bottom: 5px; }

        .calendar-cell {
            aspect-ratio: 1 / 1.3;
            border: 1px solid #eee;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .calendar-cell:hover {
            background-color: #f8f0fb;
            border-color: #4a148c;
        }

        .calendar-cell.has-data {
            background-color: #f3e5f5;
        }

        .date-num { color: #999; }
        .has-data .date-num { color: #4a148c; font-weight: bold; }

        .work-label {
            background: #4a148c;
            color: white;
            font-size: 9px;
            padding: 1px 3px;
            border-radius: 4px;
            margin-top: 4px;
            max-width: 90%;
            overflow: hidden;
        }

        .filter-section { margin-bottom: 10px; text-align: left; }
        .hint-text { font-size: 11px; color: #7b1fa2; margin-top: 5px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>📅 工作時數管理 📅</h2>
    
    <div class="input-group">
        <label>💪🏻 目標時數 (hr)</label>
        <input type="number" id="goalInput" value="38" onchange="renderAll()">
    </div>

    <div class="input-group">
        <label>💜 今日時數 💜</label>
        <div style="display: flex; gap: 8px;">
            <input type="number" id="dailyHour" placeholder="時" style="flex:1">
            <input type="number" id="dailyMin" placeholder="分" style="flex:1">
        </div>
    </div>

    <button class="btn-main" onclick="addRecord()">💾 儲存時數</button>

    <div class="progress-section">
        <div class="stats-container">
            <div class="stat-box highlight">
                <span style="font-size: 15px; opacity: 0.8;">目前剩餘</span><br>
                <span id="sessionGap" style="font-size: 20px;">0</span> hr
            </div>
            <div class="stat-box">
                <span style="font-size: 15px; opacity: 0.8;">目前累計</span><br>
                <span id="sessionTotal" style="font-size: 20px;">0</span> hr
            </div>
        </div>
    </div>

    <button class="btn-settle" onclick="settleAndReset()">🏁 結算(統計歸零)</button>

    <div class="filter-section">
        <label>🔍 歷史回顧</label>
        <select id="monthFilter" onchange="renderAll()"></select>
        <div class="hint-text">💡 點擊日期可「補記」或「修改」</div>
    </div>

    <div id="calendarContainer">
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('workRecords')) || [];
    let lastSettleTime = parseInt(localStorage.getItem('lastSettleTime')) || 0;

    initMonthFilter();
    renderAll();

    function initMonthFilter() {
        const select = document.getElementById('monthFilter');
        const now = new Date();
        for (let i = 0; i < 6; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            const val = `${d.getFullYear()}-${d.getMonth() + 1}`;
            const text = `${d.getFullYear()}年 ${d.getMonth() + 1}月`;
            select.add(new Option(text, val));
        }
    }

    // 通用新增函數
    function saveToRecords(y, m, d, hours) {
        const timestamp = Date.now();
        records.unshift({
            id: timestamp,
            year: y,
            month: m,
            day: d,
            key: `${y}-${m}`,
            hours: hours
        });
        localStorage.setItem('workRecords', JSON.stringify(records));
        renderAll();
    }

    function addRecord() {
        const h = parseFloat(document.getElementById('dailyHour').value) || 0;
        const min = parseFloat(document.getElementById('dailyMin').value) || 0;
        const total = h + (min / 60);
        if (total <= 0) return;

        const now = new Date();
        saveToRecords(now.getFullYear(), now.getMonth() + 1, now.getDate(), total);
        
        document.getElementById('dailyHour').value = "";
        document.getElementById('dailyMin').value = "";
    }

    function settleAndReset() {
        if (confirm("確定結算？上方階段統計將重新開始。")) {
            lastSettleTime = Date.now();
            localStorage.setItem('lastSettleTime', lastSettleTime);
            renderAll();
        }
    }

    // 處理日曆點擊 (補記或修改)
    function handleDateClick(y, m, d, dayRecords) {
        if (dayRecords.length === 0) {
            // 補記邏輯
            const val = prompt(`補記 ${m}/${d} 的時數 (小時)：`);
            if (val && !isNaN(val) && val > 0) {
                saveToRecords(y, m, d, parseFloat(val));
            }
        } else {
            // 修改邏輯
            const total = dayRecords.reduce((s, r) => s + r.hours, 0).toFixed(1);
            const action = prompt(`[ ${m}/${d} ] 紀錄管理\n當天累計：${total} 小時\n\n1. 輸入數字：新增/補記一筆時數\n2. 輸入 'd'：刪除當天最後一筆\n3. 輸入 'c'：取消操作`);
            
            if (!action || action === 'c') return;

            if (action.toLowerCase() === 'd') {
                const lastId = dayRecords[0].id;
                records = records.filter(r => r.id !== lastId);
                localStorage.setItem('workRecords', JSON.stringify(records));
                renderAll();
            } else if (!isNaN(action) && action > 0) {
                saveToRecords(y, m, d, parseFloat(action));
            }
        }
    }

    function renderAll() {
        const goal = parseFloat(document.getElementById('goalInput').value) || 0;
        const [year, month] = document.getElementById('monthFilter').value.split('-').map(Number);
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = "";

        // 更新統計
        let sessionTotal = 0;
        records.forEach(r => { if (r.id > lastSettleTime) sessionTotal += r.hours; });
        document.getElementById('sessionTotal').innerText = sessionTotal.toFixed(1);
        document.getElementById('sessionGap').innerText = Math.max(0, goal - sessionTotal).toFixed(1);

        // 生成日曆標頭
        ['日', '一', '二', '三', '四', '五', '六'].forEach(w => {
            const h = document.createElement('div');
            h.className = 'calendar-day-head';
            h.innerText = w;
            grid.appendChild(h);
        });

        const firstDay = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();

        for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));

        for (let i = 1; i <= daysInMonth; i++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-cell';
            const dayRecords = records.filter(r => r.year === year && r.month === month && r.day === i);
            
            if (dayRecords.length > 0) {
                cell.classList.add('has-data');
                const sum = dayRecords.reduce((s, r) => s + r.hours, 0);
                cell.innerHTML = `<span class="date-num">${i}</span><div class="work-label">${sum.toFixed(1)}h</div>`;
            } else {
                cell.innerHTML = `<span class="date-num">${i}</span>`;
            }

            cell.onclick = () => handleDateClick(year, month, i, dayRecords);
            grid.appendChild(cell);
        }
        localStorage.setItem('workGoal', goal);
    }

    if(localStorage.getItem('workGoal')) {
        document.getElementById('goalInput').value = localStorage.getItem('workGoal');
        renderAll();
    }
</script>

</body>
</html>
